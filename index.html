<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F2FD">
  <meta name="description" content="LMS ICM — Analisis Chapter, Lesson Plan Builder, dan Approval Pimpinan untuk KB-TK, SD, SMP, SMA.">
  <meta name="robots" content="noindex, nofollow">
  <title>LMS ICM · Academic Preparation & Governance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236B5FD6'/%3E%3Cpath d='M32 16 10 27l22 11 18-9v13h4V27z' fill='%23fff'/%3E%3Cpath d='M20 35v8c0 4 6 7 12 7s12-3 12-7v-8l-12 6z' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
  <script>
    /* Terapkan tema sebelum render pertama (cegah kedip) */
    (function () { try { var t = localStorage.getItem('lmsicm:theme'); if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; document.documentElement.setAttribute('data-theme', t || 'light'); } catch (e) {} })();
  </script>
  <!-- Percepat koneksi pertama ke backend GAS & CDN -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="javascript:void(0)" onclick="document.getElementById('view').focus()">Lewati ke konten utama</a>

  <!-- Layar muat awal (hanya tampil saat sesi belum tersedia di perangkat) -->
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-logo"><i class="bi bi-mortarboard-fill"></i></div>
    <div class="boot-title">LMS ICM</div>
    <div class="boot-sub">Menyiapkan ruang kerja Anda…</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <!-- Halaman login / setup -->
  <div id="authView" class="auth-view" hidden></div>

  <!-- Shell aplikasi SPA -->
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Navigasi utama"></aside>
    <div id="sidebarScrim" class="sidebar-scrim" data-act="nav.close"></div>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <nav id="bottomNav" class="bottom-nav" aria-label="Navigasi bawah"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <input type="file" id="filePicker" hidden>

  <noscript><div style="padding:24px;font-family:sans-serif;text-align:center">LMS ICM membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</div></noscript>

  <!-- Urutan penting: config → kode bersama → aplikasi (semua defer, tidak memblok tampilan) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/shared.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
